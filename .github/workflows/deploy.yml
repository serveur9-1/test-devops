name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales : le workflow ne fait que lire le dépôt.
permissions:
  contents: read

# Évite deux déploiements concurrents sur le même serveur.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Même version que backend/Dockerfile, pour tester ce qui part en prod.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lancer pytest
        working-directory: backend
        run: python -m pytest -v

  build:
    name: Image ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: serveur91225/test-devops-backend
          # Contexte = racine du dépôt : l'image Nginx copie frontend/ et nginx/.
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
            image: serveur91225/test-devops-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sur une Pull Request on construit sans publier : pas de connexion au
      # registre, donc aucun secret manipulé.
      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Publication réservée à main : un workflow_dispatch lancé depuis une
          # autre branche construit sans écraser le tag latest.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Déploiement EC2
    needs: build
    # Runner auto-hébergé sur l'EC2 : plus besoin d'ouvrir le port 22 aux
    # plages d'IP des runners GitHub, c'est le runner qui sort vers GitHub.
    runs-on: [self-hosted, Linux, X64, ec2-deploy]
    # Désactivé par défaut. Ce job ne s'exécute que si la variable de dépôt
    # DEPLOY_ENABLED vaut "true". Tant qu'elle est absente, le job est ignoré
    # sans faire échouer la pipeline.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production
    # Pas de checkout : le déploiement n'utilise aucun fichier du dépôt. Le
    # fichier Compose de production vit dans /opt/test-devops, en root:root,
    # hors de portée de gha-runner.
    steps:
      - name: Déployer le tag ${{ github.sha }}
        env:
          IMAGE_TAG: ${{ github.sha }}
        # Seule commande privilégiée autorisée par /etc/sudoers.d.
        # -n : échoue au lieu d'attendre un mot de passe.
        # Le tag passe par l'environnement plutôt que par une interpolation
        # ${{ }} dans le script, et le script revalide sa valeur.
        run: sudo -n /usr/local/sbin/test-devops-deploy "$IMAGE_TAG"
